{% extends "base.html" %}

{% block heading %}Admin — new user{% endblock %}

{% block content %}
  <div class="card" style="max-width: 460px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem;">
      <h2 style="font-size: 1.1rem; margin: 0;">Create user</h2>
      <a href="{{ url_for('admin.index') }}" style="font-size: 0.9rem;">← Back</a>
    </div>

    <form method="post">
      <div class="field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" required autofocus
               value="{{ full_name or '' }}">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required
               value="{{ email or '' }}">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               required minlength="8">
        <p class="muted" style="font-size: 0.8rem; margin: 0.25rem 0 0;">
          At least 8 characters. Share it with the user securely.
        </p>
      </div>
      <div class="field">
        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="user"  {{ 'selected' if role != 'admin' else '' }}>User</option>
          <option value="admin" {{ 'selected' if role == 'admin' else '' }}>Admin</option>
        </select>
      </div>
      <button type="submit" style="width: 100%;">Create user</button>
    </form>
  </div>
{% endblock %}
