{% extends "base.html" %}

{% block heading %}Edit driver{% endblock %}

{% block content %}
<div class="card" style="max-width:640px;">
  <h2 style="font-size:1.1rem; margin:0 0 1rem;">Edit {{ driver.full_name }}</h2>
  <form method="post" action="{{ url_for('drivers.edit_driver', driver_id=driver.id) }}">
    <div class="field">
      <label for="full_name">Full name</label>
      <input type="text" id="full_name" name="full_name" required
             value="{{ form.get('full_name', driver.full_name) }}">
    </div>
    <div class="field">
      <label for="staff_id">Staff ID</label>
      <input type="text" id="staff_id" name="staff_id"
             value="{{ form.get('staff_id', driver.staff_id) }}">
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone"
             value="{{ form.get('phone', driver.phone) }}">
    </div>
    <div class="field">
      <label for="license_number">License number</label>
      <input type="text" id="license_number" name="license_number"
             value="{{ form.get('license_number', driver.license_number) }}">
    </div>
    <div class="field">
      <label for="license_expiry">License expiry</label>
      <input type="date" id="license_expiry" name="license_expiry"
             value="{{ form.get('license_expiry', driver.license_expiry or '') }}">
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
        <input type="checkbox" name="active" value="on"
               {% if form and form.get('active') == 'off' %}{% elif not form and not driver.active %}{% else %}checked{% endif %}>
        Active
      </label>
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="3">{{ form.get('notes', driver.notes) }}</textarea>
    </div>
    <div style="display:flex; gap:0.6rem;">
      <button type="submit">Save</button>
      <a class="btn-edit"
         href="{{ url_for('drivers.detail', driver_id=driver.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
