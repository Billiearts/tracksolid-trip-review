{% extends "base.html" %}

{% block heading %}&nbsp;{% endblock %}

{% block content %}
  <div class="card auth-card">
    <h1>Set new password</h1>
    <form method="post" id="reset-form">
      <input type="hidden" name="access_token" id="access_token"
             value="{{ access_token }}">

      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password"
               required minlength="8">
        <p class="muted" style="font-size: 0.8rem; margin: 0.25rem 0 0;">
          At least 8 characters.
        </p>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm"
               required minlength="8">
      </div>
      <button type="submit" style="width: 100%;">Update password</button>
    </form>
    <p class="swap">
      <a href="{{ url_for('auth.login') }}">← Back to sign in</a>
    </p>
  </div>

  <script>
    (function () {
      // Supabase puts the recovery token in the URL fragment:
      //   /reset-password#access_token=...&type=recovery&...
      // It's not sent to the server on the initial request, so we have to
      // read it here and stash it in the hidden input.
      const hash = window.location.hash.slice(1);
      if (!hash) return;

      const params = new URLSearchParams(hash);
      const token = params.get("access_token");
      const field = document.getElementById("access_token");
      if (token && field) field.value = token;
    })();
  </script>
{% endblock %}
