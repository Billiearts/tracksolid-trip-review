{% extends "base.html" %}

{% block heading %}&nbsp;{% endblock %}

{% block content %}
  <div class="card auth-card">
    <div class="auth-logo-head">
      <img src="{{ url_for('static', filename='gbc_logo.png') }}"
           alt="Trip Review">
      <h2>Trip Review</h2>
      <p>Set a new password</p>
    </div>

    <form method="post" id="reset-form">
      <input type="hidden" name="access_token" id="access_token"
             value="{{ access_token or '' }}">

      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password"
               required minlength="8">
        <p class="muted" style="font-size: 0.8rem; margin: 0.25rem 0 0;">
          At least 8 characters.
        </p>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm"
               required minlength="8">
      </div>
      <button type="submit" style="width: 100%;">Update password</button>
    </form>
    <p class="swap">
      <a href="{{ url_for('auth.login') }}">← Back to sign in</a>
    </p>
  </div>

  <script>
    (function () {
      const SUPABASE_URL      = {{ (supabase_url      or '') | tojson }};
      const SUPABASE_ANON_KEY = {{ (supabase_anon_key or '') | tojson }};

      const field = document.getElementById("access_token");
      if (!field) return;
      if (field.value) return;

      const hash = window.location.hash.slice(1);
      if (hash) {
        const hp = new URLSearchParams(hash);
        const t = hp.get("access_token");
        if (t) { field.value = t; return; }
      }

      const qp = new URLSearchParams(window.location.search);
      const code = qp.get("code");
      if (!code) return;

      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        console.error("Supabase URL/anon key missing from template context");
        return;
      }

      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      s.onload = async function () {
        try {
          const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const { data, error } = await client.auth.exchangeCodeForSession(code);
          if (error) throw error;
          if (data && data.session && data.session.access_token) {
            field.value = data.session.access_token;
          }
        } catch (e) {
          console.error("PKCE exchange failed", e);
          alert("This reset link is invalid or has expired.");
        }
      };
      document.head.appendChild(s);
    })();
  </script>
{% endblock %}
