{% extends "base.html" %}

{% block heading %}&nbsp;{% endblock %}

{% block content %}
  <div class="card auth-card">
    <div class="auth-logo-head">
      <img src="{{ url_for('static', filename='gbc_logo.png') }}"
           alt="Trip Review">
      <h2>Trip Review</h2>
      <p>Sign in to continue</p>
    </div>

    <form method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" style="width: 100%;">Sign in</button>
    </form>
    <p class="swap">
      <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
    </p>
    <p class="swap">
      No account? <a href="{{ url_for('auth.register') }}">Register</a>
    </p>
  </div>
{% endblock %}
